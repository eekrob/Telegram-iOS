name: AyuGram iOS compile check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayugram-ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile simulator target
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Create compile-only configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          with open("build-system/appstore-configuration.json", "r", encoding="utf-8") as source:
              configuration = json.load(source)

          # These values are intentionally non-production. This workflow only
          # verifies that the simulator target compiles.
          configuration["api_id"] = "1"
          configuration["api_hash"] = "00000000000000000000000000000000"
          configuration["app_center_id"] = "0"
          configuration["is_internal_build"] = "true"
          configuration["is_appstore_build"] = "false"
          configuration["appstore_id"] = "0"
          configuration["premium_iap_product_id"] = ""
          configuration["enable_siri"] = False
          configuration["enable_icloud"] = False

          with open("build-system/ci-compile-configuration.json", "w", encoding="utf-8") as output:
              json.dump(configuration, output, indent=2)
              output.write("\n")
          PY

      - name: Import repository test certificates
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Compile Telegram simulator target
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="$((10000 + GITHUB_RUN_NUMBER))"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/bazel-root" \
            --cacheDir="$RUNNER_TEMP/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ci-compile-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber="$BUILD_NUMBER"
